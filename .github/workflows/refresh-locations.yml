name: Refresh store locations
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # every Monday 04:17 UTC
  push:
    branches: [main]
    paths: ['scripts/fetch-locations.mjs', '.github/workflows/refresh-locations.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-locations.mjs
      - name: Commit if changed
        run: |
          git config user.name "wichtel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/locations.json
          git diff --cached --quiet || (git commit -m "Refresh store locations from OpenStreetMap" && git push)
